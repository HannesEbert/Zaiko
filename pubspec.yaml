name: zaiko
description: >-
  Zaiko (在庫) — a household food inventory tracker. Track groceries,
  manage expiration dates, and share shopping lists with your household.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  mobile_scanner: ^7.4.0
  package_info_plus: ^10.2.1
  # Pinned to 12.x: 13.x pulls permission_handler_android 14.0.0, whose Gradle
  # script needs AGP 9 / Kotlin 2.3. Lift back to ^13.0.0 when Flutter (and thus
  # AGP/Kotlin) is next upgraded.
  permission_handler: ^12.0.0
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.2
  supabase_flutter: ^2.16.0
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  wakelock_plus: ^1.7.0

dev_dependencies:
  build_runner: ^2.15.1
  fake_async: ^1.3.3
  freezed: ^3.2.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
